name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    # ci/test.sh starts a throwaway Synapse from this image, as add-person.sh would set it up.
    container: matrixdotorg/synapse
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            person: ramiro
            localpart: "{person}.{name}"
            exclusive: "true"
          # Agent accounts named @<person>+ses_..., for people whose names contain dots, in a namespace that isn't
          # exclusive.
          - name: plus-localpart
            person: john.smith
            localpart: "{person}+{name}"
            exclusive: "false"
    steps:
      - uses: actions/checkout@v7
      - run: ci/test.sh
        env:
          TEST_PERSON: ${{ matrix.person }}
          TEST_LOCALPART: ${{ matrix.localpart }}
          TEST_EXCLUSIVE: ${{ matrix.exclusive }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p 'require("./opencode-plugin/package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - name: npm pack
        run: |
          cp LICENSE opencode-plugin/
          mkdir dist
          npm pack ./opencode-plugin --pack-destination dist
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/*.tgz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
